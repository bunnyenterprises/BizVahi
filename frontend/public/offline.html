<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Business Vahi — You're Offline</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: #002FA7;
  color: white;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  text-align: center;
  padding: 24px;
}
.logo { font-size: 48px; font-weight: 900; letter-spacing: -2px; margin-bottom: 8px; }
.logo span { opacity: 0.6; }
h1 { font-size: 22px; font-weight: 700; margin: 24px 0 8px; }
p { font-size: 14px; opacity: 0.7; line-height: 1.6; max-width: 300px; margin-bottom: 32px; }
button {
  background: white;
  color: #002FA7;
  border: none;
  padding: 14px 32px;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  border-radius: 0;
}
.tip {
  margin-top: 40px;
  font-size: 12px;
  opacity: 0.5;
  max-width: 280px;
  line-height: 1.6;
}
</style>
</head>
<body>
  <div class="logo">Led<span>gr</span></div>
  <div style="font-size: 48px; margin: 16px 0;">📡</div>
  <h1>You're Offline</h1>
  <p>No internet connection right now. Connect to Wi-Fi or mobile data to access your Business Vahi account.</p>
  <button onclick="window.location.reload()">Try Again</button>
  <div class="tip">
    Tip: Download the Business Vahi desktop app to work completely offline — no internet needed at all.
  </div>
</body>
</html>
